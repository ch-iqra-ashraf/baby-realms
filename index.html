<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Baby Realm</title>
</head>

<body>

    <!-- nav section starts here -->

    <nav class="flex justify-between pt-2">
        <div>
            <img src="images/logo.svg" alt="logo">
        </div>

        <div class="hidden md:block">
            <input type="search" placeholder="     Search Products"
                class="w-80 h-10 border border-gray-300 hover:border-teal-700 rounded-full mt-4">
            <button class="bg-teal-700 text-white h-10 rounded-full w-25">Search</button>
        </div>


        <div class="text-teal-700 flex justify-center mr-4 p-5 gap-x-4">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-6">
                <path fill-rule="evenodd"
                    d="M7.5 6a4.5 4.5 0 1 1 9 0 4.5 4.5 0 0 1-9 0ZM3.751 20.105a8.25 8.25 0 0 1 16.498 0 .75.75 0 0 1-.437.695A18.683 18.683 0 0 1 12 22.5c-2.786 0-5.433-.608-7.812-1.7a.75.75 0 0 1-.437-.695Z"
                    clip-rule="evenodd" />
            </svg>
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-6">
                <path
                    d="m11.645 20.91-.007-.003-.022-.012a15.247 15.247 0 0 1-.383-.218 25.18 25.18 0 0 1-4.244-3.17C4.688 15.36 2.25 12.174 2.25 8.25 2.25 5.322 4.714 3 7.688 3A5.5 5.5 0 0 1 12 5.052 5.5 5.5 0 0 1 16.313 3c2.973 0 5.437 2.322 5.437 5.25 0 3.925-2.438 7.111-4.739 9.256a25.175 25.175 0 0 1-4.244 3.17 15.247 15.247 0 0 1-.383.219l-.022.012-.007.004-.003.001a.752.752 0 0 1-.704 0l-.003-.001Z" />
            </svg>
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-6">
                <path
                    d="M2.25 2.25a.75.75 0 0 0 0 1.5h1.386c.17 0 .318.114.362.278l2.558 9.592a3.752 3.752 0 0 0-2.806 3.63c0 .414.336.75.75.75h15.75a.75.75 0 0 0 0-1.5H5.378A2.25 2.25 0 0 1 7.5 15h11.218a.75.75 0 0 0 .674-.421 60.358 60.358 0 0 0 2.96-7.228.75.75 0 0 0-.525-.965A60.864 60.864 0 0 0 5.68 4.509l-.232-.867A1.875 1.875 0 0 0 3.636 2.25H2.25ZM3.75 20.25a1.5 1.5 0 1 1 3 0 1.5 1.5 0 0 1-3 0ZM16.5 20.25a1.5 1.5 0 1 1 3 0 1.5 1.5 0 0 1-3 0Z" />
            </svg>
        </div>
    </nav>

    <div class="hidden md:flex justify-center items-center bg-teal-700 text-white gap-x-6 h-10">
        <p>HOME</p>
        <p>FASHION</p>
        <p>GEAR</p>
        <p>FEEDING</p>
        <p>BATH</p>
        <p>SAFETY</p>
        <p>TOYS</p>
        <p>DIAPERING</p>
        <p>MOMS</p>
        <p>NURSERY</p>
        <p>SCHOOL</p>
        <p>BIRTHDAY</p>
        <p>SALE</p>
        <p>NEW ARRIVAL</p>
    </div>
    <!-- nav section ends here -->

    <!-- hero section starts here -->

    <div class="hidden md:flex w-full snap-x snap-mandatory overflow-x-auto scroll-smooth rounded-lg">
        <div class="w-full shrink-0 snap-center"><img src="images/hero.webp" class="w-full h-100 object-cover" /></div>
        <div class="w-full shrink-0 snap-center"><img src="images/hero1.webp" class="w-full h-100 object-cover" /></div>
        <div class="w-full shrink-0 snap-center"><img src="images/hero2.webp" class="w-full h-100 object-cover" /></div>
    </div>

    <div class="flex md:hidden w-full snap-x snap-mandatory overflow-x-auto scroll-smooth rounded-lg">
        <div class="w-full shrink-0 snap-center"><img src="images/mobile-hero.webp"
                class="w-full  h-100 sm:h-130 object-cover" /></div>
        <div class="w-full shrink-0 snap-center"><img src="images/mobile-hero2.webp"
                class="w-full  h-100 sm:h-130 object-cover" /></div>
        <div class="w-full shrink-0 snap-center"><img src="images/mobile-hero3.webp"
                class="w-full  h-100 sm:h-130 object-cover" /></div>
    </div>
    <!-- hero section starts here -->

    <!-- Product categories -->
    <div class="flex flex-wrap justify-center gap-10 m-5">
        <div class="w-75 hover:opacity-70"> <img src="images/image-1.webp" alt="baby girl"> </div>
        <div class="w-75 hover:opacity-70"> <img src="images/image-2.webp" alt="baby boy"> </div>
        <div class="w-75 hover:opacity-70"> <img src="images/image-3.webp" alt="baby bags"> </div>
        <div class="w-75 hover:opacity-70"> <img src="images/image-4.webp" alt="baby footwears"> </div>
    </div>

    <!-- Best Sellers -->
    <div>
        <fieldset class="border-t border-gray-300 border-b-0 border-l-0 border-r-0 text-center">
            <legend class="px-3 font-bold text-purple-800 text-xl mx-auto">Best Seller</legend>
        </fieldset>
        <p class="text-center text-gray-500 mt-1">Enjoy the all best products</p>
    </div>

    <!-- Product images -->
   <div class="w-95 h-100 m-4">
  <div class="border border-gray-300 hover:border-teal-700 flex flex-col items-center group">
    <div class="overflow-hidden">
      <img src="images/image-7.webp" alt="Kids Sando Green" class="block group-hover:hidden transition-opacity duration-300">
      <img src="images/image-8.webp" alt="Kids Sando Green" class="hidden group-hover:block transition-transform duration-300 scale-100 group-hover:scale-110  w-full h-full object-cover">
    </div>
    <p class="image-description">Kids Sando &amp; Short Set White and Pink - Oolaa</p>
    <div>
      <div>Quick Shop</div>
    </div>
  </div>
</div>
</body>

</html>
